<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ULTRABOARD - FACON PRO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0a0507;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Target Full Layer Iframe */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Merah Putih Luxury Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #2a080c 0%, #0a0304 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Multi-Ring Red & White Neon Spinner */
    .spinner-box {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 28px;
    }

    /* Ring 1: Merah Kemerdekaan */
    .spinner-ring:nth-child(1) {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #ff003c;
      border-right-color: #ff3366;
      border-radius: 50%;
      animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      filter: drop-shadow(0 0 12px rgba(255, 0, 60, 0.8));
    }

    /* Ring 2: Putih Perak */
    .spinner-ring:nth-child(2) {
      position: absolute;
      width: 76%;
      height: 76%;
      top: 12%;
      left: 12%;
      border: 3px solid transparent;
      border-top-color: #ffffff;
      border-right-color: #e2e8f0;
      border-radius: 50%;
      animation: spin-reverse 0.8s linear infinite;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
    }

    /* Ring 3: Emas 81 Tahun */
    .spinner-ring:nth-child(3) {
      position: absolute;
      width: 52%;
      height: 52%;
      top: 24%;
      left: 24%;
      border: 3px solid transparent;
      border-top-color: #fbbf24;
      border-right-color: #f59e0b;
      border-radius: 50%;
      animation: spin 1.4s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.7));
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    /* Badge 81 Tahun */
    .ri-badge {
      background: linear-gradient(135deg, #ff003c 0%, #990024 100%);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Brand Title Gradient Merah Putih */
    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
      background: linear-gradient(180deg, #ffffff 45%, #ff3366 55%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
    }

    .loading-text {
      color: #f1f5f9;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-height: 24px;
      text-align: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .loading-text.fade-out {
      opacity: 0;
      transform: translateY(-4px);
    }
  </style>
</head>
<body>

  <!-- Overlay Loader Kemerdekaan RI 81 -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="ri-badge">HUT RI KE-81 🇮🇩</div>
    <div class="spinner-box">
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
      <div class="spinner-ring"></div>
    </div>
    <div class="brand-title">ULTRABOARD</div>
    <div id="dynamicText" class="loading-text">Nusantara Berkarya...</div>
  </div>

  <!-- Google Apps Script Iframe -->
  <iframe 
    id="appIframe"
    src="https://script.google.com/macros/s/AKfycbxsBKI9bj5PrJnFB6UILUTOFNi5equ7PAodsX6cQ2DMchZ-ovObG1OzlFG8kBHb847l/exec"
    allow="fullscreen">
  </iframe>

  <script>
    // Teks Semarak Kemerdekaan RI 81
    const statusTexts = [
      "Nusantara Berkarya... 🇮🇩",
      "Menyiapkan System Farm...",
      "Indonesia Maju 81 Tahun... ✨",
      "Sinkronisasi Data Realtime...",
      "Hampir Selesai..."
    ];

    let currentTextIdx = 0;
    const textElement = document.getElementById("dynamicText");
    const overlayElement = document.getElementById("loadingOverlay");
    const iframeElement = document.getElementById("appIframe");

    // Efek Teks Berganti Tiap 1.5 Detik
    const textInterval = setInterval(() => {
      textElement.classList.add("fade-out");
      setTimeout(() => {
        currentTextIdx = (currentTextIdx + 1) % statusTexts.length;
        textElement.innerText = statusTexts[currentTextIdx];
        textElement.classList.remove("fade-out");
      }, 250);
    }, 1500);

    // Hilangkan Loader Setelah Iframe Selesai Memuat
    iframeElement.onload = function() {
      setTimeout(() => {
        clearInterval(textInterval);
        overlayElement.classList.add("hidden");
      }, 600);
    };

    // Safety Timeout (Maksimal 8 Detik Otomatis Terbuka)
    setTimeout(() => {
      clearInterval(textInterval);
      overlayElement.classList.add("hidden");
    }, 8000);
  </script>

</body>
</html>
